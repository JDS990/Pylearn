<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyLearn</title>
<meta name="description" content="Tap-first Python drills, from zero to your own language model. Works offline.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f6fde" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121820" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyLearn">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="drills.css">
</head>
<body>
<header id="bar">
  <div class="bar-in">
    <button id="backBtn" class="ib hidden" aria-label="Back">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="barTitle">Py<span>Learn</span></div>
    <button id="streakChip" class="pg-badge" title="Rank, XP and day streak">🔥 <b>0</b></button>
  </div>
  <div id="sessProg" class="hidden"><div></div></div>
</header>
<main id="view"><div class="loading">Loading…</div></main>
<div id="actbar" class="hidden"></div>
<nav id="tabs" aria-label="Sections">
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3 4 4.5 4 8.5A4 4 0 0 1 8 11.5c0-1.5.7-2.6 1.5-3.5.2 1.6 1 2.5 2 2.8C11 8 11.4 5.4 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 15a6 6 0 0 0 12 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Today</span></button>
  <button data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Lessons</span></button>
  <button data-tab="cards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="14" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Cards</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg><span>More</span></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script src="game.js"></script>
<script src="sync.js"></script>
<script src="tutor.js"></script>
<script src="drills.js"></script>
</body>
</html>
