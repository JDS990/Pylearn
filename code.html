<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyLearn: Coding lessons</title>
<meta name="description" content="Learn Python from zero to your own language model. Runs offline in your browser.">
<meta name="theme-color" content="#0f1419">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyLearn">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <a id="homeBtn" class="iconbtn" href="./" aria-label="Back to drills" title="Back to drills">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <button id="menuBtn" class="iconbtn" aria-label="Open lesson list" aria-controls="drawer" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="toptitle"><span class="brand">Py<span>Learn</span></span><span id="topLesson"></span></div>
  <div id="pyStatus" class="pystatus loading" title="Python status"><span class="dot"></span><span class="lbl">Python…</span></div>
</header>
<div id="overlay" class="hidden"></div>
<aside id="drawer" aria-label="Lessons">
  <div id="brand">
    <h1>Py<span>Learn</span></h1>
    <div class="sub">From zero to your own language model</div>
    <div id="progressbar"><div></div></div>
    <div id="progresstext"></div>
  </div>
  <nav id="nav"></nav>
  <div id="sidefoot">
    <div class="footrow">
      <button class="b small" id="exportBtn" title="Download your progress and code as a JSON file">⬇ Export</button>
      <button class="b small" id="importBtn" title="Load progress from a JSON file">⬆ Import</button>
      <button class="linkbtn" id="resetAll" title="Erase all progress and saved code">Reset</button>
    </div>
    <div class="footnote" id="offlineNote">Works offline once loaded. Progress is stored on this device.</div>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
</aside>
<main id="main"><div id="content"><div class="loading-msg">Loading lessons…</div></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
